</style></head><body><main><div class="eyebrow">Unit 6 · Environmental Science</div><h1>Save Our City!</h1><p class="muted">Every choice changes the future.</p><div class="stats" id="stats"></div><div class="scene" id="scene"></div><div class="eyebrow" id="stage"></div><section class="panel" id="screen"></section></main><script>
const MODES={standard:{label:'Standard',count:[0,0],spread:0},moderate:{label:'Moderate',count:[2,3],spread:.10},challenging:{label:'Challenging',count:[4,5],spread:.20},extreme:{label:'Extreme',count:[6,7],spread:.30}};
const EVENTS=[
 {title:'Severe rainstorm',kind:'storm',desc:'Heavy rain strains drainage and washes sediment toward the river.'},
 {title:'Summer heat wave',kind:'heat',desc:'Several unusually hot days put vulnerable residents at risk.'},
 {title:'Community conservation grant',kind:'grant',desc:'A regional foundation offers matching funds for visible environmental improvements.'},
 {title:'Recycling market slowdown',kind:'recycling',desc:'Demand for recycled materials falls, reducing expected program revenue.'},
 {title:'New residents arrive',kind:'growth',desc:'A growing population places additional demands on services and resources.'},
 {title:'Volunteer stewardship drive',kind:'volunteer',desc:'Residents organize a weekend of cleanup and habitat stewardship.'},
 {title:'Aging water main breaks',kind:'water',desc:'A water main failure disrupts service and requires urgent repairs.'},
 {title:'Unexpected federal efficiency rebate',kind:'rebate',desc:'A limited rebate becomes available for cities with established efficiency programs.'},
 {title:'Invasive species outbreak',kind:'invasive',desc:'An invasive plant spreads along parks and streams, displacing native vegetation.'},
 {title:'Public debate over land use',kind:'debate',desc:'Residents disagree over whether to protect more land or allow new construction.'}
];
function hashSeed(input){let h=2166136261;for(let i=0;i<input.length;i++){h^=input.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=seed>>>0;return ()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function buildSchedule(){let cfg=MODES[st.mode],r=rng(hashSeed(st.seed+'|schedule'));let n=cfg.count[0]+Math.floor(r()*(cfg.count[1]-cfg.count[0]+1));let turns=Array.from({length:10},(_,i)=>i).sort(()=>0);for(let i=turns.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[turns[i],turns[j]]=[turns[j],turns[i]]}let types=EVENTS.map((_,i)=>i);for(let i=types.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[types[i],types[j]]=[types[j],types[i]]}st.events={};for(let i=0;i<n;i++)st.events[turns[i]]=types[i]}
function randomFactor(step,key){if(st.mode==='standard')return 1;let r=rng(hashSeed(st.seed+'|'+step+'|'+key));return 1+(r()*2-1)*MODES[st.mode].spread}
function runEvent(step){if(st.events[step]===undefined)return null;let item=EVENTS[st.events[step]],e=st.e,h=st.h,s=st.s,r=st.r,b=st.budget;let changes={},details='',protectedBy='';
const prev=(text)=>st.history.some(d=>d.choice.toLowerCase().includes(text));
let risk=st.r>=650?.55:st.r>=500?.80:st.r<350?1.35:1;
let hit=(key,amount)=>{changeValue(key,Math.round(amount));};
switch(item.kind){
case 'storm':{let mitigated=prev('stream')||prev('wetland')||prev('buffer');let loss=Math.round(-75*risk*(mitigated?.45:1));hit('e',loss);hit('r',Math.round(loss*.7));hit('h',Math.round(loss*.4));details=mitigated?'Earlier stream restoration reduced sediment damage.':'Unprotected drainage and riverbanks suffered heavy damage.';protectedBy=mitigated?'Stream restoration':'None';break}
case 'heat':{let mitigated=prev('cooling')||prev('shade')||prev('trees');let loss=Math.round(-80*risk*(mitigated?.40:1));hit('h',loss);hit('s',Math.round(loss*.3));details=mitigated?'Earlier cooling and shade investments reduced heat exposure.':'Residents lacked sufficient cooling and shade.';protectedBy=mitigated?'Cooling or shade investments':'None';break}
case 'grant':{let eligible=st.history.some(d=>d.cost>=180000);let grant=eligible?115000:35000;st.budget=Math.min(START,st.budget+grant);hit('s',eligible?20:8);details=eligible?'Existing projects qualified for a larger matching grant.':'The city received a smaller planning grant because few qualifying projects were underway.';break}
case 'recycling':{let mitigated=prev('compost')||prev('food waste');let loss=mitigated?25000:65000;st.budget=Math.max(0,st.budget-loss);hit('s',mitigated?-8:-22);details=mitigated?'Composting and waste prevention diversified the program, limiting losses.':'Reliance on material sales caused a larger financial setback.';protectedBy=mitigated?'Waste diversification':'None';break}
case 'growth':{let loss=Math.round(-50*risk);hit('r',loss);hit('e',Math.round(loss*.75));hit('h',Math.round(loss*.45));details='More residents increase demand for water, energy, roads and waste collection. Stronger resilience reduced the strain.';break}
case 'volunteer':{let boost=st.s>=600?75:st.s>=450?50:25;hit('e',boost);hit('s',20);details=st.s>=600?'High public trust produced strong turnout.':'Volunteer turnout was limited by community participation.';break}
case 'water':{let loss=Math.round(-75*risk);hit('r',loss);hit('h',Math.round(loss*.7));let cost=Math.min(st.budget,Math.round(65000*risk));st.budget-=cost;details='Emergency pipe repairs cost '+fmt(cost)+'. Resilient infrastructure reduced the damage and repair bill.';break}
case 'rebate':{let eligible=prev('insulation')||prev('solar')||prev('efficiency')||prev('electrif');let grant=eligible?95000:20000;st.budget=Math.min(START,st.budget+grant);details=eligible?'Previous efficiency investments qualified for a larger rebate.':'Only a smaller general planning credit was available.';break}
case 'invasive':{let mitigated=prev('habitat')||prev('sanctuary')||prev('nesting');hit('e',mitigated?-30:-85);hit('r',-15);details=mitigated?'Habitat management limited the spread.':'Limited habitat management allowed the invasive species to spread more widely.';protectedBy=mitigated?'Habitat management':'None';break}
case 'debate':{let support=st.s>=650;hit('s',support?15:-60);details=support?'Residents trusted city leaders enough to negotiate a compromise.':'Low public trust intensified opposition and slowed cooperation.';break}
}
// Independent seeded 20% exceptional outcome per scheduled event.
// These are beneficial additions, never a replacement for the scientifically grounded event.
const extraordinary=rng(hashSeed(st.seed+'|golden-luck|'+step))()<0.20;
if(extraordinary){
  const windfall=30000;
  st.budget=Math.min(START,st.budget+windfall);
  changeValue('e',22);changeValue('h',16);changeValue('s',20);changeValue('r',15);
  details+=' EXTRAORDINARY BREAK: Local partners provide additional labor, equipment, and a '+fmt(windfall)+' grant, helping the city recover faster. This is a rare favorable outcome.';
}
for(let k of ['e','h','s','r'])changes[k]=st[k]-({e,h,s,r})[k];return {title:item.title,description:item.desc,details,protectedBy,changes,money:st.budget-b,extraordinary};
}

const missions=[{"title": "Wildlife at Risk", "topic": "Conservation & Preservation", "story": "A rare fox population is declining as roads and construction divide its habitat.", "choices": [{"name": "Wait and monitor", "cost": 0, "e": -15, "h": -2, "s": 5, "why": "Habitat loss continues while you collect information.", "tag": "wildlife", "socialWhy": "Waiting avoids immediate expense and restrictions, but neighbors near the shrinking habitat may feel officials are ignoring the problem."}, {"name": "Citizen science surveys", "cost": 90000, "e": 6, "h": 1, "s": 12, "why": "Monitoring helps identify where animals live, but does not protect habitat.", "tag": "wildlife", "socialWhy": "Volunteer surveys give residents a way to help and give scientists useful observations; landowners are not asked to change how they use their property."}, {"name": "Restore habitat corridors", "cost": 280000, "e": 23, "h": 5, "s": 7, "why": "Corridors reconnect habitats and help animals find food and mates.", "tag": "wildlife", "socialWhy": "Corridors may require easements across private land and changes to road projects; nearby landowners may worry about access and property values."}, {"name": "Protect a large sanctuary", "cost": 520000, "e": 34, "h": 4, "s": -8, "why": "Protected land limits development and safeguards habitat, but some residents object.", "tag": "wildlife", "socialWhy": "A sanctuary can limit construction, recreation, and land use; residents who depend on development or access to the area may object."}]}, {"title": "The City Trash Mountain", "topic": "Waste Management", "story": "The landfill is filling quickly, and residents complain about odors and runoff.", "choices": [{"name": "Defer action (no new spending)", "cost": 0, "e": -12, "h": -14, "s": 8, "why": "The city postpones new spending. Existing environmental and infrastructure problems remain and may worsen.", "tag": "landfill", "socialWhy": "Residents avoid an immediate bill, but affected neighborhoods may resent the delay."}, {"name": "Launch recycling education", "cost": 160000, "e": 14, "h": 7, "s": 14, "why": "Better sorting and participation divert materials from landfills.", "tag": "recycle", "socialWhy": "Households can participate without major new equipment; some still dislike having to learn sorting rules."}, {"name": "Add composting collection", "cost": 250000, "e": 22, "h": 12, "s": 6, "why": "Food scraps become useful compost instead of decomposing in landfills.", "tag": "compost", "socialWhy": "Separate food-scrap bins and pickup routes take effort; residents may worry about smells and collection schedules."}, {"name": "Build sorting and compost facilities", "cost": 470000, "e": 34, "h": 17, "s": 2, "why": "Advanced sorting plus composting diverts more waste, but costs more.", "tag": "compost", "socialWhy": "New facilities require construction and higher fees, and neighborhoods near the site may be concerned about truck traffic."}]}, {"title": "The Invisible Shield", "topic": "Ozone Layer", "story": "Old air conditioners may leak ozone-depleting refrigerants. Residents want a response.", "choices": [{"name": "Delay action", "cost": 0, "e": -17, "h": -16, "s": 6, "why": "Leaks may continue and release ozone-depleting substances.", "tag": "ozone", "socialWhy": "Businesses avoid replacement costs now, but families may worry about the long-term effects of continued leaks."}, {"name": "Teach safe disposal", "cost": 80000, "e": 7, "h": 6, "s": 12, "why": "Education helps, but does not recover refrigerants already in equipment.", "tag": "ozone", "socialWhy": "Repair shops and households can participate at relatively low cost, though some find the instructions inconvenient."}, {"name": "Recover and dispose of refrigerants", "cost": 210000, "e": 22, "h": 18, "s": 6, "why": "Proper recovery prevents releases of ozone-depleting chemicals.", "tag": "ozone", "socialWhy": "Certified technicians must collect and handle refrigerants; some owners object to service fees and appointment delays."}, {"name": "Replace old equipment and recover gases", "cost": 430000, "e": 32, "h": 24, "s": -1, "why": "Upgrades reduce leak risks, but are expensive and disruptive.", "tag": "ozone", "socialWhy": "Replacing old equipment can mean costly purchases and temporary interruptions to cooling for homes and businesses."}]}, {"title": "The Energy Dilemma", "topic": "Climate Change", "story": "Electricity demand is increasing and most of the city's electricity comes from fossil fuels.", "choices": [{"name": "Maintain current system", "cost": 0, "e": -18, "h": -10, "s": 8, "why": "Continuing fossil fuel use maintains greenhouse gas emissions.", "tag": "climate", "socialWhy": "Electricity service stays familiar and costs little upfront, but some residents worry about continuing pollution."}, {"name": "Upgrade insulation and lighting", "cost": 150000, "e": 15, "h": 9, "s": 14, "why": "Efficiency cuts energy demand and saves operating costs.", "tag": "climate", "socialWhy": "Schools and homeowners benefit from lower energy bills; renovation work can briefly disrupt classrooms or homes."}, {"name": "Solar panels on public buildings", "cost": 360000, "e": 28, "h": 14, "s": 7, "why": "Solar electricity displaces some fossil-fuel generation.", "tag": "climate", "socialWhy": "Public-building solar makes savings visible, though residents may question the payback period and roof maintenance."}, {"name": "Major clean-energy transition", "cost": 620000, "e": 39, "h": 19, "s": -5, "why": "Larger emissions reductions come with substantial up-front costs.", "tag": "climate", "socialWhy": "Large infrastructure changes can require roadwork, rate adjustments, and construction; residents want assurance that the benefits reach everyone."}]}, {"title": "The River Runs Brown", "topic": "Conservation & Pollution", "story": "After heavy rain, muddy water carries sediment into the river near your school.", "choices": [{"name": "Ignore runoff", "cost": 0, "e": -16, "h": -12, "s": 5, "why": "Sediment can harm aquatic habitats and water quality.", "tag": "river", "socialWhy": "No new work avoids construction, but downstream families and anglers may object to muddy water."}, {"name": "Post signs and recruit volunteers", "cost": 70000, "e": 6, "h": 3, "s": 13, "why": "Education builds support but has limited direct impact.", "tag": "river", "socialWhy": "Volunteer cleanups build pride, though some residents see signs and events as insufficient action."}, {"name": "Plant vegetated stream buffers", "cost": 210000, "e": 21, "h": 15, "s": 7, "why": "Roots help hold soil and vegetation filters some runoff.", "tag": "river", "socialWhy": "Streamside planting may limit mowing or farming near the banks; some landowners need help changing practices."}, {"name": "Restore stream banks and wetlands", "cost": 410000, "e": 32, "h": 22, "s": 1, "why": "Restoration slows runoff, traps sediment and supports habitat.", "tag": "river", "socialWhy": "Restoring wetlands can require buying land, altering drainage, and temporarily closing trails or fields."}]}, {"title": "The Cafeteria Waste Problem", "topic": "Waste Reduction", "story": "The schools throw away large amounts of food and single-use packaging.", "choices": [{"name": "Keep current practices", "cost": 0, "e": -11, "h": -4, "s": 5, "why": "Avoiding changes leaves unnecessary waste in the system.", "tag": "school", "socialWhy": "School routines stay familiar, but students and families who notice waste may be disappointed."}, {"name": "Reusable bottle refill stations", "cost": 85000, "e": 10, "h": 5, "s": 14, "why": "Reusable containers can reduce single-use waste.", "tag": "school", "socialWhy": "Refill stations are easy to use, but maintenance staff must keep filters and fountains working."}, {"name": "Food waste prevention campaign", "cost": 135000, "e": 17, "h": 9, "s": 12, "why": "Better portions and planning can reduce wasted food.", "tag": "school", "socialWhy": "Changing portion sizes and tracking lefto e city postpones new spending. Existing environmental and infrastructure problems remain and may worsen.", "tag": "heat", "socialWhy": "Residents avoid an immediate bill, but affected neighborhoods may resent the delay."}, {"name": "Open cooling centers", "cost": 110000, "e": 5, "h": 19, "s": 12, "why": "Cooling centers reduce heat exposure for residents who can access them.", "tag": "heat", "socialWhy": "Libraries and schools can offer immediate relief, but residents need transportation and reliable hours."}, {"name": "Plant shade trees in hot neighborhoods", "cost": 220000, "e": 16, "h": 15, "s": 10, "why": "Trees provide shade and cooling, but take time to grow.", "tag": "heat", "socialWhy": "Shade trees improve streets and playgrounds, but roots, leaf litter, and maintenance can concern property owners."}, {"name": "Cooling centers plus trees and cool roofs", "cost": 420000, "e": 27, "h": 29, "s": 2, "why": "Combining immediate protection and long-term cooling improves resilience.", "tag": "heat", "socialWhy": "Cool roofs and new facilities may require construction and tax funding; residents may disagree about which neighborhoods go first."}]}, {"title": "The Recycling Breakdown", "topic": "Waste Management", "story": "Your recycling plant is rejecting loads because trash is mixed with recyclable materials.", "choices": [{"name": "Defer action (no new spending)", "cost": 0, "e": -12, "h": -8, "s": 6, "why": "The city postpones new spending. Existing environmental and infrastructure problems remain and may worsen.", "tag": "recycle", "socialWhy": "Residents avoid an immediate bill, but affected neighborhoods may resent the delay."}, {"name": "Teach correct sorting", "cost": 75000, "e": 11, "h": 6, "s": 15, "why": "Clear instructions can reduce contamination.", "tag": "recycle", "socialWhy": "Clear instructions make recycling easier, though some residents dislike repeated reminders or changing rules."}, {"name": "Improve collection labels and bins", "cost": 180000 let lows=[['e','environmental'],['h','public-health'],['s','community'],['r','infrastructure']].filter(([k])=>st[k]<300);
if(lows.length){let [k,label]=lows.sort((a,b)=>st[a[0]]-st[b[0]])[0];let repair=125000;if(st.budget>=repair){st.budget-=repair;extra=repair;let gained=changeValue(k,35);emergency=`${label} conditions fell below 300. The city had to spend ${fmt(repair)} on urgent stabilization, recovering ${gained} points. This is a limited emergency repair, not a complete solution.`}else{changeValue('h',-25);changeValue('s',-25);emergency=`${label} conditions fell below 300, but the city could not afford ${fmt(repair)} in emergency repairs. Health and public trust suffered (up to −25 each).`}}
let randomEvent=runEvent(step);if(randomEvent&&randomEvent.extraordinary)st.luckyEvents++;let delta={};for(let k of ['e','h','s','r'])delta[k]=st[k]-before[k];
st.history.push({title:m.title,choice:c.name,cost:c.cost,spent:c.cost+extra-savings-(randomEvent?randomEvent.money:0),randomEvent,savings,extra,why:c.why,socialWhy:c.socialWhy,delta,explain,event,emergency,scores:{e:st.e,h:st.h,s:st.s,r:st.r},budget:st.budget});st.done=true;draw()}

function finish(){let scores=[st.e,st.h,st.s,st.r],min=Math.min(...scores),avg=Math.round(scores.reduce((a,b)=>a+b)/4),title,story;

enly. '}${st.h<350?'Environmental health risks strain clinics and households. ':st.h>620?'Residents face fewer environmental hazards. ':'Health risks still require attention. '}${st.s<350?'Residents protest and resist additional changes. ':st.s>620?'Residents are generally willing to cooperate. ':'Public support is mixed. '}${st.r<350?'A major storm could overwhelm aging infrastructure.':st.r>620?'Infrastructure can better withstand future disruptions.':'Infrastructure still needs maintenance and upgrades.'}</p><p class="mini">Randomness mode: <b>${MODES[st.mode].label}</b>. ${st.mode==='extreme'?`Extraordinary event outcomes: <b>${st.luckyEvents}/${Object.keys(st.events).length}</b>.`: ''} Scenario code: <b>${esc(st.seed)}</b>. Replay with the same code and decisions to reproduce the same random events.</p>${cityNarrative()}<h2>Decision record</h2>${st.history.map((d,i)=>`<div class="result"><b>${i+1}. ${esc(d.title)}</b><p>${esc(d.choice)} · ${fmt(d.spent)}</p><p class="small">${esc(d.why)} ${esc(d.socialWhy)}</p><p class="mini">Change: environment ${d.delta.e>=0?'+':''}${d.delta.e}, health ${d.delta.h>=0?'+':''}${d.delta.h}, community ${d.delta.s>=0?'+':''}${d.delta.s}, resilience ${d.delta.r>=0?'+':''}${d.delta.r}.</p>${d.randomEvent?`<p class="mini"><b>Random event:</b> ${esc(d.randomEvent.title)} — ${esc(d.randomEvent.details)}</p>`:''}${d.event?`<p class="mini"><b>Consequence:</b> ${esc(d.event)}</p>`:''}${d.emergency?`<p class="mini"><b>Emergency:</b> ${esc(d.emergency)}</p>`:''}</div>`).join('')}<h2>Student exit ticket</h2><ol><li>Which choice had an unexpected consequence? Explain the scientific connection.</li><li>Why did community support change during one of your decisions?</li><li>What did you have to sacrifice to improve another variable?</li><li>How did emergency costs affect your budget, if they occurred?</li><li>What would you change in a second attempt, and what evidence supports your answer?</li></ol><div class="actions"><button class="btn" id="print">Print or save report</button><button class="btn secondary" id="restart">Play again</button></div><p class="mini">All numerical scores, costs and scenarios are fictional. Use real scientific evidence before making actual public policy.</p>`;wireAchievements();$('restart').onclick=init;$('print').onclick=()=>window.print()}
